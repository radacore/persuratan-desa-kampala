{#- Tombol dan panel widget chat. Logika di /static/js/widget.js -#}
<button class="chat-fab" id="chat-fab" type="button" aria-controls="chat" aria-expanded="false">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  Tanya desa
</button>

<section class="chat" id="chat" data-buka="0" aria-hidden="true" aria-label="Asisten layanan desa">
  <header class="chat__head">
    <img src="/static/favicon.svg" alt="" width="32" height="32">
    <div>
      <strong>Asisten {{ nama_desa }}</strong>
      <span>Balasan otomatis · jam kerja 08.00–15.00 WITA</span>
    </div>
    <button class="chat__tutup" type="button" data-chat-tutup aria-label="Tutup chat">&times;</button>
  </header>

  <div class="chat__badan" data-chat-badan role="log" aria-live="polite" aria-relevant="additions">
    <div class="msg msg--bot">Selamat datang di layanan {{ nama_desa }}. Silakan pilih menu atau ketik pertanyaan Anda.</div>
  </div>

  <form class="chat__kaki" data-chat-form autocomplete="off">
    <label class="sr-only" for="chat-input">Tulis pesan</label>
    <textarea id="chat-input" data-chat-input rows="1" maxlength="500"
              placeholder="Tulis pertanyaan Anda…"></textarea>
    <button class="chat__kirim" type="submit" data-chat-kirim aria-label="Kirim pesan">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
</section>
